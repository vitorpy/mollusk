[workspace]
members = [
    "bencher",
    "cli",
    "error",
    "fuzz/*",
    "harness",
    "programs/*",
    "result",
    "test-programs/*",
]
resolver = "2"

[workspace.package]
authors = ["Anza Technology Maintainers <maintainers@anza.xyz>"]
repository = "https://github.com/anza-xyz/mollusk"
readme = "README.md"
license-file = "LICENSE"
edition = "2021"
version = "0.12.0"

[workspace.dependencies]
agave-feature-set = { git = "https://github.com/vitorpy/agave.git", rev = "2483b993c0ac391232e1646210d9b8bda657cb2e" }
